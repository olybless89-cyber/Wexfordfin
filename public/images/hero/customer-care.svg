<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Wexfordfin Customer Care Unit">
  <defs>
    <linearGradient id="cc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a2a"/>
      <stop offset="1" stop-color="#1d3763"/>
    </linearGradient>
    <radialGradient id="cc-spot" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="cc-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2c52"/>
      <stop offset="1" stop-color="#0c1526"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#cc-bg)"/>
  <rect width="1600" height="900" fill="url(#cc-spot)"/>

  <!-- wall panels -->
  <g fill="#101a31" opacity="0.8">
    <rect x="0" y="0" width="400" height="900"/>
    <rect x="1200" y="0" width="400" height="900"/>
  </g>

  <!-- reception desk -->
  <rect x="250" y="580" width="1100" height="230" rx="26" fill="url(#cc-desk)"/>
  <rect x="250" y="580" width="1100" height="18" rx="9" fill="#d5b25f"/>

  <!-- agents -->
  <g fill="#243a66">
    <rect x="480" y="380" width="200" height="210" rx="100"/>
    <rect x="900" y="380" width="200" height="210" rx="100"/>
  </g>
  <g fill="#3a568f">
    <circle cx="580" cy="350" r="70"/>
    <circle cx="1000" cy="350" r="70"/>
  </g>
  <g stroke="#d5b25f" stroke-width="8" stroke-linecap="round">
    <path d="M560 350h40M1000 350h-40"/>
  </g>

  <!-- wall brand -->
  <g font-family="Georgia, serif">
    <text x="800" y="150" text-anchor="middle" font-size="72" letter-spacing="10" fill="#f3d98a">WEXFORDFIN</text>
    <text x="800" y="210" text-anchor="middle" font-size="34" letter-spacing="6" fill="#9fb9e8">CUSTOMER CARE UNIT</text>
  </g>
  <circle cx="800" cy="300" r="46" fill="#2563eb" stroke="#f3d98a" stroke-width="3"/>
  <path d="M790 300h20M800 290v20" stroke="#ffffff" stroke-width="4" fill="none"/>

  <!-- desk screens -->
  <g fill="#0a1020">
    <rect x="360" y="640" width="200" height="120" rx="10"/>
    <rect x="1040" y="640" width="200" height="120" rx="10"/>
  </g>
  <g fill="none" stroke="#3c5684" stroke-width="2">
    <rect x="360" y="640" width="200" height="120" rx="10"/>
    <rect x="1040" y="640" width="200" height="120" rx="10"/>
  </g>
  <g fill="#9cd4ff" font-family="Arial" font-size="20" text-anchor="middle">
    <text x="460" y="710">Wexfordfin</text>
    <text x="1140" y="710">Wexfordfin</text>
  </g>

  <!-- plants -->
  <g stroke="#1f6d4a" stroke-width="6" fill="#1f6d4a" opacity="0.9">
    <path d="M160 810c0-90 40-140 40-140M160 810c0-70-50-110-50-110M1440 810c0-90-40-140-40-140M1440 810c0-70 50-110 50-110"/>
  </g>

  <!-- floor -->
  <rect y="810" width="1600" height="90" fill="#0a1220"/>
  <text x="800" y="870" text-anchor="middle" font-family="Georgia, serif" font-size="44" letter-spacing="12" fill="#2c446e" opacity="0.8">WEXFORDFIN</text>
</svg>
