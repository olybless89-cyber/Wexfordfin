<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Wexfordfin Global Headquarters at Night">
  <defs>
    <linearGradient id="hq-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.5" stop-color="#10203e"/>
      <stop offset="1" stop-color="#263e63"/>
    </linearGradient>
    <linearGradient id="hq-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a6e"/>
      <stop offset="1" stop-color="#3370b8"/>
    </linearGradient>
    <radialGradient id="hq-moon" cx="0.15" cy="0.18" r="0.3">
      <stop offset="0" stop-color="#e8ecff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#e8ecff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="hq-windowGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3d98a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f3d98a" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#hq-sky)"/>
  <rect width="1600" height="900" fill="url(#hq-moon)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="300" cy="80" r="2" opacity="0.8"/>
    <circle cx="520" cy="130" r="1.5" opacity="0.6"/>
    <circle cx="950" cy="60" r="2.2" opacity="0.8"/>
    <circle cx="1250" cy="150" r="1.6" opacity="0.6"/>
    <circle cx="1450" cy="70" r="2" opacity="0.8"/>
    <circle cx="700" cy="40" r="1.4" opacity="0.5"/>
  </g>

  <!-- tower -->
  <g>
    <rect x="500" y="120" width="600" height="780" fill="url(#hq-glass)"/>
    <g fill="#163161" opacity="0.85">
      <g>
        <rect x="499" y="120" height="780" width="2"/>
        <rect x="750" y="120" height="780" width="2"/>
        <rect x="1001" y="120" height="780" width="2"/>
        <rect x="1099" y="120" height="780" width="2"/>
      </g>
      <g>
        <rect x="500" y="200" width="600" height="1.5"/>
        <rect x="500" y="280" width="600" height="1.5"/>
        <rect x="500" y="360" width="600" height="1.5"/>
        <rect x="500" y="440" width="600" height="1.5"/>
        <rect x="500" y="520" width="600" height="1.5"/>
        <rect x="500" y="600" width="600" height="1.5"/>
        <rect x="500" y="680" width="600" height="1.5"/>
        <rect x="500" y="760" width="600" height="1.5"/>
        <rect x="500" y="840" width="600" height="1.5"/>
      </g>
    </g>
    <!-- lit windows -->
    <g fill="url(#hq-windowGlow)" font-size="0">
      <rect x="540" y="150" width="30" height="180"/>
      <rect x="610" y="110" width="30" height="220"/>
      <rect x="690" y="170" width="30" height="160"/>
      <rect x="1070" y="130" width="30" height="200"/>
      <rect x="500" y="120" width="600" height="780" mask="none"/>
    </g>
    <!-- crown brand -->
    <rect x="500" y="60" width="600" height="60" fill="#0a1220"/>
    <text x="800" y="99" text-anchor="middle" font-family="Georgia, serif" font-size="38" letter-spacing="8" fill="#f3d98a">WEXFORDFIN</text>
    <circle cx="800" cy="30" r="18" fill="#2563eb" stroke="#f3d98a" stroke-width="2"/>
  </g>

  <!-- city silhouette -->
  <g fill="#0c1424">
    <rect x="0" y="620" width="500" height="280"/>
    <rect x="1100" y="560" width="500" height="340"/>
  </g>
  <g fill="#364d7c" font-size="0">
    <rect x="30" y="730" width="40" height="10"/>
    <rect x="90" y="680" width="40" height="10"/>
    <rect x="1170" y="640" width="40" height="10"/>
    <rect x="1250" y="600" width="40" height="10"/>
  </g>

  <!-- reflection -->
  <rect y="890" width="1600" height="10" fill="#22395e" opacity="0.6"/>
  <text x="800" y="960" font-size="1" >.</text>
</svg>
