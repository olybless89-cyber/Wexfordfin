<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Wexfordfin ATM Gallery">
  <defs>
    <linearGradient id="atm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1524"/>
      <stop offset="1" stop-color="#14224a"/>
    </linearGradient>
    <linearGradient id="atm-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cd4ff"/>
      <stop offset="1" stop-color="transparent"/>
    </linearGradient>
    <radialGradient id="atm-spot" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#atm-bg)"/>
  <rect width="1600" height="900" fill="url(#atm-spot)"/>

  <!-- back wall -->
  <rect x="0" y="0" width="1600" height="640" fill="#0d1830"/>
  <rect x="0" y="620" width="1600" height="14" fill="#2a3c6b"/>

  <!-- floor -->
  <rect y="634" width="1600" height="266" fill="#0b1220"/>
  <g stroke="#1c2c4e" opacity="0.7">
    <path d="M0 700h1600M0 780h1600M0 850h1600"/>
    <path d="M400 634L300 900M800 634L800 900M1200 634L1300 900"/>
  </g>

  <!-- ATM row -->
  <g>
    <!-- ATM 1 -->
    <g transform="translate(180,210)">
      <rect width="240" height="430" rx="20" fill="#101a30" stroke="#2b3c67" stroke-width="3"/>
      <rect x="18" y="18" width="204" height="60" rx="8" fill="#2563eb"/>
      <text x="120" y="56" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#ffffff" letter-spacing="2">WEXFORDFIN</text>
      <rect x="30" y="110" width="180" height="120" rx="6" fill="#0a1020" stroke="#334458"/>
      <rect x="30" y="110" width="180" height="120" rx="6" fill="url(#atm-glow)" opacity="0.35"/>
      <text x="120" y="160" text-anchor="middle" font-family="Arial" font-size="18" fill="#9cd4ff">Welcome</text>
      <rect x="80" y="260" width="80" height="10" rx="3" fill="#3c4f7e"/>
      <rect x="80" y="285" width="80" height="10" rx="3" fill="#3c4f7e"/>
      <rect x="80" y="310" width="80" height="10" rx="3" fill="#3c4f7e"/>
      <rect x="40" y="350" width="160" height="34" rx="6" fill="#1a2ace"/>
      <text x="120" y="373" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Insert Card</text>
    </g>
    <!-- ATM 2 -->
    <g transform="translate(450,180) scale(1.05)">
      <rect width="240" height="450" rx="20" fill="#101a30" stroke="#3a4d7f" stroke-width="3"/>
      <rect x="18" y="18" width="204" height="60" rx="8" fill="#2563eb"/>
      <text x="120" y="56" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#ffffff" letter-spacing="2">WEXFORDFIN</text>
      <rect x="30" y="110" width="180" height="120" rx="6" fill="#0a1020" stroke="#334458"/>
      <text x="120" y="160" text-anchor="middle" font-family="Arial" font-size="18" fill="#9cd4ff">24/7</text>
      <rect x="80" y="260" width="80" height="10" rx="3" fill="#3c4f7e"/>
      <rect x="80" y="285" width="80" height="10" rx="3" fill="#3c4f7e"/>
      <rect x="40" y="350" width="160" height="34" rx="6" fill="#1a2ace"/>
      <text x="120" y="373" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Insert Card</text>
    </g>
    <!-- ATM 3 -->
    <g transform="translate(750,210)">
      <rect width="240" height="430" rx="20" fill="#101a30" stroke="#2b3c67" stroke-width="3"/>
      <rect x="18" y="18" width="204" height="60" rx="8" fill="#2563eb"/>
      <text x="120" y="56" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#ffffff" letter-spacing="2">WEXFORDFIN</text>
      <rect x="30" y="110" width="180" height="120" rx="6" fill="#0a1020" stroke="#334458"/>
      <text x="120" y="160" text-anchor="middle" font-family="Arial" font-size="18" fill="#9cd4ff">Withdraw</text>
      <rect x="80" y="260" width="80" height="10" rx="3" fill="#3c4f7e"/>
      <rect x="80" y="285" width="80" height="10" rx="3" fill="#3c4f7e"/>
      <rect x="40" y="350" width="160" height="34" rx="6" fill="#1a2ace"/>
      <text x="120" y="373" text-anchor="middle" font-family="Arial" font-size="14" fill="#fff">Insert Card</text>
    </g>
  </g>

  <!-- wall brand -->
  <rect x="1040" y="140" width="480" height="200" rx="20" fill="#0e1628" stroke="#3a4d7f" stroke-width="2"/>
  <g font-family="Georgia, serif">
    <text x="1280" y="215" text-anchor="middle" font-size="52" fill="#f3d98a" letter-spacing="8">WEXFORDFIN</text>
    <text x="1280" y="270" text-anchor="middle" font-size="24" fill="#8fb0ec" letter-spacing="4">ATM GALLERY</text>
  </g>

  <!-- ceiling lights -->
  <g fill="#cfe3ff">
    <ellipse cx="300" cy="60" rx="90" ry="10" opacity="0.9"/>
    <ellipse cx="800" cy="60" rx="90" ry="10" opacity="0.9"/>
    <ellipse cx="1300" cy="60" rx="90" ry="10" opacity="0.9"/>
  </g>

  <!-- floor brand -->
  <text x="800" y="845" text-anchor="middle" font-family="Georgia, serif" font-size="48" letter-spacing="12" fill="#2a3e6e" opacity="0.7">WEXFORDFIN</text>
</svg>
